# UEFI boot menu. No timeout: installing erases the disk, so it waits for a choice.
set timeout=-1
set default=0

menuentry "Install Kiosk OS (ERASES THIS COMPUTER'S DISK)" {
    linux /install.amd/vmlinuz auto=true priority=critical locale=en_US.UTF-8 keymap=us file=/cdrom/preseed.cfg --- quiet
    initrd /install.amd/initrd.gz
}

menuentry "Cancel: restart the computer" {
    reboot
}
