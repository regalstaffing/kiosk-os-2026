# Debian 13 preseed for the kiosk USB installer.
# Erases the chosen disk, installs a minimal Debian, then runs scripts/setup.sh.
# The only questions asked: the root (admin) password, and which disk if there is more than one.
# Never put passwords or other secrets in this file.

# Language, keyboard, time
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string America/Chicago
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# Network: use whichever port has a cable connected
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string kiosk
d-i netcfg/get_domain string local
d-i netcfg/hostname string kiosk
d-i hw-detect/load_firmware boolean true

# Package mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true

# Accounts: root password is asked during install; no other user
d-i passwd/make-user boolean false

# Disk: erase it and use one partition plus swap
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Packages: no desktop; the setup script installs the rest
tasksel tasksel/first multiselect
d-i pkgsel/include string git ca-certificates cage chromium fonts-noto-core fontconfig python3 kbd python3-gi gir1.2-gtk-3.0 network-manager
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default

# Download the kiosk files; setup.sh runs on first boot (kiosk-firstboot.service),
# which is more reliable than running it inside the installer.
d-i preseed/late_command string \
    in-target git clone https://github.com/regalstaffing/kiosk-os-2026 /opt/kiosk-os && \
    cp /target/opt/kiosk-os/system/kiosk-firstboot.service /target/etc/systemd/system/ && \
    in-target systemctl enable kiosk-firstboot.service
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
