# BIOS boot menu. No timeout: installing erases the disk, so it waits for Enter.
default kiosk
prompt 1
timeout 0
display /isolinux/kiosk.msg

label kiosk
  kernel /install.amd/vmlinuz
  append initrd=/install.amd/initrd.gz auto=true priority=critical locale=en_US.UTF-8 keymap=us file=/cdrom/preseed.cfg vga=788 --- quiet
