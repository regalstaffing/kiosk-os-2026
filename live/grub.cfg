# Kiosk OS (run from stick) boot menu. The same file serves BIOS and UEFI.
# Two system slots (A and B) on the KIOSKDATA partition. A new version is
# tried once (try_slot); kiosk-live makes it the default after it starts fine,
# so if it fails to start, a restart brings back the previous version.
set timeout=3
set timeout_style=menu
search --no-floppy --label KIOSKDATA --set=data
search --no-floppy --label KIOSKEFI --set=efi
set envfile=($efi)/kiosk/grubenv
load_env --file $envfile default_slot try_slot
if [ "$default_slot" != "B" ]; then set default_slot=A; fi
set slot=$default_slot
if [ -n "$try_slot" ]; then
    set slot=$try_slot
    set try_slot=
    save_env --file $envfile try_slot
fi
if [ "$slot" = "A" ]; then set other=B; else set other=A; fi

insmod all_video
set gfxpayload=keep

# Kernel options: run from the stick; never load internal disk drivers, so the
# PC's own drive is never touched; quiet boot splash; restart 10 s after a crash.
set opts="boot=live components noeject quiet splash loglevel=3 vt.global_cursor_default=0 panic=10 modprobe.blacklist=ahci,nvme,ata_piix,ata_generic,pata_acpi,mmc_block"

menuentry "Kiosk" {
    linux ($data)/live/$slot/vmlinuz $opts live-media-path=/live/$slot
    initrd ($data)/live/$slot/initrd.img
}
menuentry "Kiosk (previous version)" {
    linux ($data)/live/$other/vmlinuz $opts live-media-path=/live/$other
    initrd ($data)/live/$other/initrd.img
}
