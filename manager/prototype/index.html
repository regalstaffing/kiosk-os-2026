<title>Kiosk Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell, slim nav rail on the left (top bar on phones), one working pane. */
:root {
  --bg: #f5f6f8;
  --panel: #ffffff;
  --line: #dfe3ea;
  --fg: #18202e;
  --muted: #5d6779;
  --accent: #1f4fbf;
  --accent-soft: #e5ecfb;
  --ok: #1d7a46;   --ok-soft: #e1f3e8;
  --warn: #9a6200; --warn-soft: #fbf0d9;
  --bad: #b3261e;  --bad-soft: #fbe5e3;
  --font-ui: "Figtree", "Segoe UI", system-ui, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "Cascadia Mono", monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151c; --panel: #181e27; --line: #2a3340; --fg: #e6eaf0; --muted: #98a2b3;
  --accent: #7ea2ff; --accent-soft: #1f2b45;
  --ok: #6fd39a; --ok-soft: #173325; --warn: #f0bf5a; --warn-soft: #3a2e14; --bad: #ff8a80; --bad-soft: #3d1d1b;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11151c; --panel: #181e27; --line: #2a3340; --fg: #e6eaf0; --muted: #98a2b3;
  --accent: #7ea2ff; --accent-soft: #1f2b45;
  --ok: #6fd39a; --ok-soft: #173325; --warn: #f0bf5a; --warn-soft: #3a2e14; --bad: #ff8a80; --bad-soft: #3d1d1b;
  color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-ui); }
.shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100%; }
nav { border-right: 1px solid var(--line); background: var(--panel); padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; display: flex; flex-direction: column; gap: 4px; }
.brand { font-weight: 700; font-size: 17px; margin: 0 8px 18px; display: flex; align-items: center; gap: 8px; }
.brand svg { flex: none; }
nav a { color: var(--muted); text-decoration: none; padding: 8px 10px; border-radius: 6px; font-weight: 500; display: flex; justify-content: space-between; }
nav a:hover { color: var(--fg); background: var(--bg); }
nav a.on { color: var(--accent); background: var(--accent-soft); }
nav .count { font: 12px var(--font-data); color: var(--muted); }
.theme { margin-top: auto; display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.theme button { flex: 1; border: 0; background: none; padding: 5px 6px; font-size: 13px; font-weight: 500; color: var(--muted); }
.theme button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }
.proto { margin-top: 10px; font-size: 12px; color: var(--muted); padding: 10px; border: 1px dashed var(--line); border-radius: 6px; }
main { padding-block: 28px 48px; padding-left: 32px; padding-right: max(32px, env(safe-area-inset-right, 0px)); min-width: 0; }
h1 { font-size: 24px; margin: 0; text-wrap: balance; }
h2 { font-size: 16px; margin: 0 0 10px; }
.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 65ch; }
.summary { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--muted); cursor: pointer; }
.chip b { color: var(--fg); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
input[type=text], input[type=search], input[type=password], input[type=number], select, textarea {
  font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
textarea { width: 100%; min-height: 90px; resize: vertical; box-sizing: border-box; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button { font: inherit; font-weight: 600; border-radius: 6px; padding: 7px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
button.danger { color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 720px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); }
td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--bg); }
td a { color: var(--fg); font-weight: 600; text-decoration: none; }
td a:hover { color: var(--accent); }
.mono { font-family: var(--font-data); font-size: 13px; }
.dim { color: var(--muted); font-size: 13px; }
.note { color: var(--muted); font-size: 13px; max-width: 32ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); background: var(--ok-soft); }
.pill.warn { color: var(--warn); background: var(--warn-soft); }
.pill.bad { color: var(--bad); background: var(--bad-soft); }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); font-weight: 600; white-space: nowrap; }
.tag.new { background: var(--warn-soft); color: var(--warn); }
.bulk { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--accent-soft); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.card { padding: 18px; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 0; }
dt { color: var(--muted); font-size: 13px; }
dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-weight: 600; font-size: 14px; }
.field .hint { color: var(--muted); font-size: 13px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.back { color: var(--muted); text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 8px; }
.back:hover { color: var(--accent); }
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.gcard { padding: 16px; text-decoration: none; color: var(--fg); display: flex; flex-direction: column; gap: 8px; }
.gcard:hover { border-color: var(--accent); }
.gcard .stats { display: flex; gap: 14px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--panel); padding: 10px 16px; border-radius: 6px; font-weight: 600; }
.err { color: var(--bad); font-size: 13px; }
.sitelist { font-family: var(--font-data); font-size: 13px; min-height: 220px; }
.banner { border: 1px solid var(--warn); background: var(--warn-soft); color: var(--fg); border-radius: 6px; padding: 10px 12px; font-size: 14px; margin-bottom: 14px; }
.chk { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
.chk + .chk { margin-top: 6px; }
.chk:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.chk input { margin-top: 3px; }
.chk .meta { color: var(--muted); font-size: 13px; }
.chk a { font-size: 13px; color: var(--accent); margin-left: auto; white-space: nowrap; }
.st-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.st-tools input[type=search] { flex: 1 1 180px; min-width: 0; }
.st-add { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.st-add input { flex: 1 1 160px; min-width: 0; }
.st-wrap { border: 1px solid var(--line); border-radius: 6px; max-height: 420px; overflow: auto; }
.st-wrap table { min-width: 0; }
.st-wrap th { position: sticky; top: 0; background: var(--panel); z-index: 1; }
.st-wrap th button.sort { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; }
.st-wrap td { padding: 7px 12px; }
.st-wrap td.site { font-family: var(--font-data); font-size: 13px; overflow-wrap: anywhere; }
.st-wrap td.note { color: var(--muted); font-size: 13px; }
.st-wrap td.act { text-align: right; width: 1%; white-space: nowrap; }
button.link { border: 0; background: none; color: var(--muted); font-weight: 500; font-size: 13px; padding: 2px 6px; }
.st-wrap .sn { display: none; color: var(--muted); font-family: var(--font-ui, inherit); font-size: 12px; }
@media (max-width: 560px) { .st-wrap th.note, .st-wrap td.note { display: none; } .st-wrap .sn { display: block; } }
button.link:hover { color: var(--bad); }
.st-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-top: 8px; color: var(--muted); font-size: 13px; }
.import { border: 1px dashed var(--accent); border-radius: 6px; padding: 12px; margin-bottom: 10px; background: var(--accent-soft); }
.import ul { margin: 6px 0; padding-left: 18px; font-family: var(--font-data); font-size: 12px; max-height: 120px; overflow: auto; }
.src { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.section-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 18px 0 8px; }
.section-title:first-child { margin-top: 0; }
@media (max-width: 760px) {
  .shell { grid-template-columns: 1fr; }
  nav { flex-direction: row; flex-wrap: wrap; align-items: center; border-right: 0; border-bottom: 1px solid var(--line); padding-block: 10px; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .brand { margin: 0 8px 0 0; width: 100%; }
  .proto { display: none; }
  .theme { margin-top: 0; margin-left: auto; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) { .toast { animation: up .2s ease-out; } @keyframes up { from { opacity: 0; translate: 0 6px; } } }
</style>

<div class="shell">
  <nav aria-label="Main">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 21h6M12 16v5" stroke="currentColor" stroke-width="2" fill="none"/></svg>
      Kiosk Manager
    </div>
    <a href="#devices" data-nav="devices">Devices <span class="count" id="nav-devices"></span></a>
    <a href="#groups" data-nav="groups">Groups <span class="count" id="nav-groups"></span></a>
    <a href="#sitelists" data-nav="sitelists">Site lists <span class="count" id="nav-sitelists"></span></a>
    <a href="#password" data-nav="password">Admin password</a>
    <div class="theme" role="group" aria-label="Appearance">
      <button type="button" data-theme-set="light">Light</button><button type="button" data-theme-set="dark">Dark</button><button type="button" data-theme-set="system">Auto</button>
    </div>
    <div class="proto">Prototype with example devices. Changes are kept only until you reload.</div>
  </nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
// ---- Data layer. In the real version these call the management service. ----
const NOW = Date.now();
const MIN = 60e3, HOUR = 60 * MIN, DAY = 24 * HOUR;
const LATEST = "cadc9f2";

const db = {
  // Reusable lists of allowed sites. A group switches whole lists on or off.
  siteLists: [
    { id: "core", name: "Regal core", description: "Company site, applications and onboarding. Every group should have this.",
      sites: [
        { site: "regalstaffing.com", note: "Company site and applicant portal" },
        { site: "applyregal.com", note: "Application form" },
        { site: "avionte.regalstaffing.com", note: "" },
        { site: "regal.myavionte.com", note: "Onboarding" },
      ] },
    { id: "payroll", name: "Payroll and tax", description: "Pay stubs, W-2s and tax forms.",
      sites: [
        { site: "tcs.adp.com", note: "ADP time and pay" },
        { site: "my.adp.com", note: "" },
        { site: "irs.gov", note: "W-4 and tax forms" },
        { site: "ssa.gov", note: "Social Security" },
      ] },
    { id: "eligibility", name: "ID and work eligibility", description: "I-9 documents and right-to-work checks.",
      sites: [
        { site: "uscis.gov", note: "I-9 form and guidance" },
        { site: "e-verify.gov", note: "" },
        { site: "travel.state.gov", note: "Passport info" },
      ] },
    { id: "jobboards", name: "Job boards", description: "Outside job search sites applicants ask for.",
      sites: ["indeed.com", "ziprecruiter.com", "linkedin.com/jobs", "glassdoor.com", "monster.com", "careerbuilder.com",
        "simplyhired.com", "snagajob.com", "usajobs.gov", "workintexas.com", "myworkdayjobs.com", "jobs.lever.co",
        "boards.greenhouse.io", "flexjobs.com", "dice.com", "roberthalf.com"].map(site => ({ site, note: "" })) },
    { id: "videos", name: "Orientation videos", description: "Lobby and training videos.",
      sites: [
        { site: "infinitelooper.tube", note: "Lobby video loop" },
        { site: "youtube.com", note: "" },
        { site: "vimeo.com/589485470", note: "Safety orientation video" },
      ] },
    { id: "safety", name: "Safety training", description: "",
      sites: [
        { site: "osha.gov", note: "" },
        { site: "cdc.gov/niosh", note: "" },
      ] },
  ],
  groups: [
    { id: "ungrouped", name: "Ungrouped", fixed: true,
      homePages: ["https://www.regalstaffing.com/portal"],
      siteLists: ["core"], sites: [],
      idleMinutes: 6, printing: false },
    { id: "lobby", name: "Lobby",
      homePages: ["https://www.regalstaffing.com/portal",
        "https://infinitelooper.tube/?videoId=6ah4yixGWc4&start=0&end=351.3&rate=1"],
      siteLists: ["core", "payroll", "eligibility", "videos"],
      sites: [{ site: "google.com/maps", note: "Directions to job sites" }],
      idleMinutes: 6, printing: false },
    { id: "training", name: "Training room",
      homePages: ["https://www.regalstaffing.com/portal"],
      siteLists: ["core", "safety", "videos"],
      sites: [{ site: "forklift-training.example.com", note: "Trial, remove after December" }],
      idleMinutes: 20, printing: true },
  ],
  devices: [
    { id: "k-7f3a", name: "Lobby kiosk 1", model: "Dell Latitude E5470", group: "lobby", version: LATEST, chromium: "156.0.7621.88", seen: NOW - 3 * MIN, notes: "Test unit. Wi-Fi only, near the front window." },
    { id: "k-91c2", name: "Lobby kiosk 2", model: "HP ProDesk 600 G2", group: "lobby", version: LATEST, chromium: "156.0.7621.88", seen: NOW - 9 * MIN, notes: "" },
    { id: "k-02be", name: "Lobby kiosk 3", model: "HP ProDesk 600 G2", group: "lobby", version: "d42245b", chromium: "156.0.7621.88", seen: NOW - 6 * HOUR, notes: "Unplugged at night by cleaning crew." },
    { id: "k-5d10", name: "Training PC A", model: "Dell OptiPlex 7040", group: "training", version: LATEST, chromium: "156.0.7621.88", seen: NOW - 12 * MIN, notes: "" },
    { id: "k-5d11", name: "Training PC B", model: "Dell OptiPlex 7040", group: "training", version: LATEST, chromium: "156.0.7621.88", seen: NOW - 2 * MIN, notes: "Keyboard replaced in October." },
    { id: "k-5d12", name: "Training PC C", model: "Dell OptiPlex 7040", group: "training", version: "ab1c29d", chromium: "155.0.7590.112", seen: NOW - 9 * DAY, notes: "Waiting on new power supply." },
    { id: "k-e4a7", name: "kiosk-e4a7", model: "Lenovo ThinkCentre M700", group: "ungrouped", version: LATEST, chromium: "156.0.7621.88", seen: NOW - 5 * MIN, notes: "", isNew: true },
    { id: "k-b8f0", name: "kiosk-b8f0", model: "Dell Latitude E7450", group: "ungrouped", version: LATEST, chromium: "156.0.7621.88", seen: NOW - 40 * MIN, notes: "", isNew: true },
  ],
  password: { changed: NOW - 18 * DAY, by: "Vectron", applied: 6 },
};

const groupById = id => db.groups.find(g => g.id === id) || db.groups[0];
const listById = id => db.siteLists.find(l => l.id === id);
function effectiveSites(siteListIds, extra) {
  const all = new Map();
  siteListIds.map(listById).filter(Boolean).forEach(l => l.sites.forEach(x => { if (!all.has(x.site)) all.set(x.site, l.name); }));
  extra.forEach(x => { if (!all.has(x.site)) all.set(x.site, "This group"); });
  return all;
}
const deviceById = id => db.devices.find(d => d.id === id);

// ---- Helpers ----
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function ago(t) {
  const d = NOW - t;
  if (d < 2 * MIN) return "just now";
  if (d < HOUR) return Math.round(d / MIN) + " min ago";
  if (d < DAY) return Math.round(d / HOUR) + " h ago";
  return Math.round(d / DAY) + " days ago";
}
function status(d) {
  const age = NOW - d.seen;
  if (age < 20 * MIN) return { cls: "ok", label: "Online", key: "online" };
  if (age < 2 * DAY) return { cls: "warn", label: "Offline", key: "offline" };
  return { cls: "bad", label: "Not seen", key: "missing" };
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => (t.hidden = true), 2600);
}
const SITE_RE = /^(https?:\/\/)?[A-Za-z0-9*][A-Za-z0-9.*-]*(:\d+)?(\/\S*)?$/;
const URL_RE = /^https?:\/\/\S+$/;
const lines = s => s.split("\n").map(x => x.trim()).filter(Boolean);

// ---- Views ----
const ui = { filter: "all", search: "", groupFilter: "", selected: new Set() };

function renderNav(route) {
  const section = route.startsWith("sitelist") ? "sitelists" : route.startsWith("group") ? "groups" : route.startsWith("device") ? "devices" : route;
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.nav === section));
  $("#nav-devices").textContent = db.devices.length;
  $("#nav-groups").textContent = db.groups.length;
  $("#nav-sitelists").textContent = db.siteLists.length;
}

function viewDevices() {
  const counts = { all: db.devices.length, online: 0, offline: 0, missing: 0, new: 0, old: 0 };
  db.devices.forEach(d => { counts[status(d).key]++; if (d.isNew) counts.new++; if (d.version !== LATEST) counts.old++; });
  const q = ui.search.toLowerCase();
  const list = db.devices.filter(d => {
    if (ui.filter === "new" && !d.isNew) return false;
    if (ui.filter === "old" && d.version === LATEST) return false;
    if (["online", "offline", "missing"].includes(ui.filter) && status(d).key !== ui.filter) return false;
    if (ui.groupFilter && d.group !== ui.groupFilter) return false;
    return !q || [d.name, d.id, d.model, d.notes, groupById(d.group).name].join(" ").toLowerCase().includes(q);
  });
  const chip = (key, label) => `<button class="chip" data-filter="${key}" aria-pressed="${ui.filter === key}">${label} <b>${counts[key]}</b></button>`;
  const sel = ui.selected.size;
  $("#view").innerHTML = `
    <div class="head"><div><h1>Devices</h1>
      <p class="sub">Every kiosk running the software. Kiosks check in every 15 minutes; new ones appear here under Ungrouped.</p></div></div>
    <div class="summary" role="group" aria-label="Filter by status">
      ${chip("all", "All")}${chip("online", "Online")}${chip("offline", "Offline")}${chip("missing", "Not seen 2+ days")}${chip("new", "New")}${chip("old", "Needs update")}
    </div>
    <div class="toolbar">
      <input type="search" id="search" style="width:min(320px,100%)" placeholder="Search name, model, notes" value="${esc(ui.search)}" aria-label="Search devices">
      <select id="groupFilter" aria-label="Filter by group"><option value="">All groups</option>
        ${db.groups.map(g => `<option value="${g.id}" ${ui.groupFilter === g.id ? "selected" : ""}>${esc(g.name)}</option>`).join("")}</select>
    </div>
    <div class="panel">
      ${sel ? `<div class="bulk"><span><b>${sel}</b> selected</span>
        <label for="bulkGroup" class="dim">Move to</label>
        <select id="bulkGroup">${db.groups.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join("")}</select>
        <button class="primary" id="bulkMove">Move</button><button id="bulkClear">Clear</button></div>` : ""}
      <div class="tablewrap"><table>
        <thead><tr><th style="width:32px"><input type="checkbox" id="selAll" aria-label="Select all shown"></th>

// ---- Site table: search, sort, add, remove, import (CSV / Excel), copy ----
// Clean up what people paste or import: "https://www.Example.com/" -> "example.com"
function normalizeSite(raw) {
  let s = String(raw || "").trim().replace(/^["']|["']$/g, "");
  s = s.replace(/^https?:\/\//i, "").replace(/^www\./i, "").replace(/\/+$/, "");
  const slash = s.indexOf("/");
  return slash < 0 ? s.toLowerCase() : s.slice(0, slash).toLowerCase() + s.slice(slash);
}
const validSite = s => SITE_RE.test(s) && !/^[*./]*$/.test(s) && s.includes(".");

function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true;
    else if (c === "," || c === ";" || c === "\t") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}

let xlsxLoading = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  return xlsxLoading ||= new Promise((ok, fail) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    sc.onload = ok; sc.onerror = () => { xlsxLoading = null; fail(new Error("Could not load the Excel reader")); };
    document.head.appendChild(sc);
  });
}

// Turn spreadsheet rows into [{site, note}]: finds the site column by its heading
// (site, url, domain, website, address) or by which column looks most like addresses.
function rowsToSites(rows) {
  if (!rows.length) return [];
  const head = rows[0].map(h => String(h).trim().toLowerCase());
  let siteCol = head.findIndex(h => /^(site|sites|url|urls|domain|domains|website|websites|address|web address)$/.test(h));
  let noteCol = head.findIndex(h => /^(note|notes|description|comment|comments|purpose)$/.test(h));
  let body = rows.slice(1);
  if (siteCol < 0) {
    body = rows;
    const width = Math.max(...rows.map(r => r.length));
    let best = 0, bestScore = -1;
    for (let c = 0; c < width; c++) {
      const score = rows.filter(r => validSite(normalizeSite(r[c]))).length;
      if (score > bestScore) { best = c; bestScore = score; }
    }
    siteCol = best;
    if (noteCol < 0 && width > 1) noteCol = siteCol === 0 ? 1 : 0;
  }
  return body.map(r => ({ raw: String(r[siteCol] ?? "").trim(), site: normalizeSite(r[siteCol]), note: noteCol >= 0 ? String(r[noteCol] ?? "").trim() : "" }))
    .filter(x => x.raw);
}

async function readSiteFile(file) {
  if (/\.(xlsx|xls|ods)$/i.test(file.name)) {
    await loadXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    return rowsToSites(XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: "" }));
  }
  return rowsToSites(parseCSV(await file.text()));
}

// Renders an editable site table into `host`. `sites` is changed in place; onChange() after each edit.
function siteTable(host, sites, onChange, key) {
  const st = siteTable.state[key] ||= { q: "", sort: "az", sel: new Set(), pending: null };
  const draw = () => {
    const q = st.q.toLowerCase();
    let shown = sites.map((x, i) => ({ ...x, i })).filter(x => !q || x.site.toLowerCase().includes(q) || x.note.toLowerCase().includes(q));
    if (st.sort === "az") shown.sort((a, b) => a.site.localeCompare(b.site));
    if (st.sort === "za") shown.sort((a, b) => b.site.localeCompare(a.site));
    if (st.sort === "new") shown.sort((a, b) => b.i - a.i);
    const p = st.pending;
    host.innerHTML = `
      ${p ? `<div class="import" role="region" aria-label="Import preview">
        <b>${esc(p.file)}</b>: ${p.fresh.length} new site${p.fresh.length === 1 ? "" : "s"}, ${p.dupes.length} already in the list${p.bad.length ? `, ${p.bad.length} not recognised as site addresses (skipped)` : ""}.
        ${p.bad.length ? `<ul>${p.bad.slice(0, 50).map(b => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}
        <div class="row" style="margin-top:8px">
          <button type="button" class="primary" data-act="imp-add" ${p.fresh.length ? "" : "disabled"}>Add ${p.fresh.length} new</button>
          <button type="button" data-act="imp-replace">Replace list with the ${p.fresh.length + p.dupes.length} imported</button>
          <button type="button" data-act="imp-cancel">Cancel</button></div></div>` : ""}
      <div class="st-add">
        <input type="text" id="${key}-new" placeholder="Add a site, e.g. example.com" aria-label="Site to add">
        <input type="text" id="${key}-note" placeholder="Note (optional)" aria-label="Note for the new site">
        <button type="button" data-act="add">Add</button>
      </div>
      <div class="st-tools">
        <input type="search" id="${key}-q" placeholder="Search ${sites.length} site${sites.length === 1 ? "" : "s"}" value="${esc(st.q)}" aria-label="Search sites">
        <select id="${key}-sort" aria-label="Sort">
          <option value="az" ${st.sort === "az" ? "selected" : ""}>A to Z</option>
          <option value="za" ${st.sort === "za" ? "selected" : ""}>Z to A</option>
          <option value="new" ${st.sort === "new" ? "selected" : ""}>Newest first</option></select>
        <label class="row" style="gap:6px"><button type="button" data-act="import">Import CSV or Excel</button></label>
        <input type="file" id="${key}-file" accept=".csv,.txt,.xlsx,.xls,.ods" hidden>
      </div>
      <div class="st-wrap"><table>
        <thead><tr><th style="width:28px"><input type="checkbox" data-act="all" aria-label="Select all shown" ${shown.length && shown.every(x => st.sel.has(x.site)) ? "checked" : ""}></th>
          <th><button type="button" class="sort" data-act="toggle-sort">Site ${st.sort === "za" ? "↑" : st.sort === "az" ? "↓" : ""}</button></th><th class="note">Note</th><th></th></tr></thead>
        <tbody>${shown.map(x => `<tr>
          <td><input type="checkbox" data-sel="${esc(x.site)}" ${st.sel.has(x.site) ? "checked" : ""} aria-label="Select ${esc(x.site)}"></td>
          <td class="site">${esc(x.site)}${x.note ? `<div class="sn">${esc(x.note)}</div>` : ""}</td><td class="note">${esc(x.note)}</td>
          <td class="act"><button type="button" class="link" data-del="${esc(x.site)}" aria-label="Remove ${esc(x.site)}">Remove</button></td></tr>`).join("") ||
          `<tr><td colspan="4" class="dim">${sites.length ? "No sites match the search." : "No sites yet. Add one above or import a spreadsheet."}</td></tr>`}</tbody>
      </table></div>
      <div class="st-foot">
        <span>${shown.length === sites.length ? `${sites.length} site${sites.length === 1 ? "" : "s"}` : `${shown.length} of ${sites.length} shown`}</span>
        <span class="row">
          ${st.sel.size ? `<button type="button" class="danger" data-act="del-sel">Remove ${st.sel.size} selected</button>` : ""}
          <button type="button" data-act="copy" ${sites.length ? "" : "disabled"}>Copy as CSV</button></span>
      </div>
      <span class="err" id="${key}-err"></span>`;

    const err = m => (host.querySelector(`#${key}-err`).textContent = m);
    const changed = () => { onChange(); draw(); };
    host.querySelector(`#${key}-q`).oninput = e => { st.q = e.target.value; const pos = e.target.selectionStart; draw(); const el = host.querySelector(`#${key}-q`); el.focus(); el.setSelectionRange(pos, pos); };
    host.querySelector(`#${key}-sort`).onchange = e => { st.sort = e.target.value; draw(); };
    const add = () => {
      const raw = host.querySelector(`#${key}-new`).value, site = normalizeSite(raw);
      if (!site) return;
      if (!validSite(site)) return err(`"${raw}" is not a site address. Use a form like example.com or example.com/jobs.`);
      if (sites.some(x => x.site === site)) return err(`${site} is already in this list.`);
      sites.push({ site, note: host.querySelector(`#${key}-note`).value.trim() });
      st.q = ""; changed(); host.querySelector(`#${key}-new`).focus();
    };
    host.querySelector(`#${key}-new`).onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); add(); } };
    host.querySelector(`#${key}-note`).onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); add(); } };
    host.querySelector(`#${key}-file`).onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const rows = await readSiteFile(f), have = new Set(sites.map(x => x.site)), seen = new Set();
        const fresh = [], dupes = [], bad = [];
        rows.forEach(r => {
          if (!validSite(r.site)) bad.push(r.raw);
          else if (seen.has(r.site)) return;
          else { seen.add(r.site); (have.has(r.site) ? dupes : fresh).push(r); }
        });
        st.pending = { file: f.name, fresh, dupes, bad }; draw();
      } catch (ex) { err("Could not read " + f.name + ": " + ex.message); }
    };
    host.onclick = e => {
      const t = e.target.closest("[data-act],[data-del]"); if (!t) return;
      if (t.dataset.del) { sites.splice(sites.findIndex(x => x.site === t.dataset.del), 1); st.sel.delete(t.dataset.del); return changed(); }
      const a = t.dataset.act;
      if (a === "add") add();
      if (a === "import") host.querySelector(`#${key}-file`).click();
      if (a === "toggle-sort") { st.sort = st.sort === "az" ? "za" : "az"; draw(); }
      if (a === "del-sel") { for (let i = sites.length - 1; i >= 0; i--) if (st.sel.has(sites[i].site)) sites.splice(i, 1); toast(`Removed ${st.sel.size} sites`); st.sel.clear(); changed(); }
      if (a === "imp-add") { sites.push(...st.pending.fresh.map(({ site, note }) => ({ site, note }))); toast(`Added ${st.pending.fresh.length} sites`); st.pending = null; changed(); }
      if (a === "imp-replace") { const all = [...st.pending.dupes, ...st.pending.fresh].map(({ site, note }) => ({ site, note })); sites.splice(0, sites.length, ...all); toast(`List replaced with ${all.length} sites`); st.pending = null; st.sel.clear(); changed(); }
      if (a === "imp-cancel") { st.pending = null; draw(); }
      if (a === "copy") {
        const csv = "site,note\n" + [...sites].sort((x, y) => x.site.localeCompare(y.site)).map(x => `${x.site},"${x.note.replace(/"/g, '""')}"`).join("\n");
        navigator.clipboard.writeText(csv).then(() => toast("Copied. Paste it into a spreadsheet."), () => err("Copy is blocked here. Select the sites in the table and copy them instead."));
      }
    };
    host.onchange = e => {
      const t = e.target;
      if (t.dataset.sel !== undefined) { t.checked ? st.sel.add(t.dataset.sel) : st.sel.delete(t.dataset.sel); draw(); }
      if (t.dataset.act === "all") { shown.forEach(x => t.checked ? st.sel.add(x.site) : st.sel.delete(x.site)); draw(); }
    };
  };
  draw();
}
siteTable.state = {};

// ---- Site lists ----
function usedBy(listId) { return db.groups.filter(g => g.siteLists.includes(listId)); }

function viewSiteLists() {
  $("#view").innerHTML = `
    <div class="head"><div><h1>Site lists</h1>
      <p class="sub">Reusable sets of allowed sites. Switch a whole list on or off for a group, and every kiosk in that group follows. Change a list once and every group using it gets the change.</p></div>
      <button class="primary" id="newList">New site list</button></div>
    <div class="groups">${db.siteLists.map(l => {
      const groups = usedBy(l.id);
      return `<a class="panel gcard" href="#sitelist-${l.id}">
        <b>${esc(l.name)}</b>
        <div class="stats"><span>${l.sites.length} site${l.sites.length === 1 ? "" : "s"}</span><span>${groups.length ? "Used by " + groups.map(g => esc(g.name)).join(", ") : "Not used yet"}</span></div>
        ${l.description ? `<div class="dim">${esc(l.description)}</div>` : ""}</a>`; }).join("")}
    </div>`;
  $("#newList").onclick = () => {
    let n = 1; while (db.siteLists.some(l => l.id === "list-" + n)) n++;
    db.siteLists.push({ id: "list-" + n, name: "New site list " + n, description: "", sites: [] });
    location.hash = "#sitelist-list-" + n;
  };
}

function viewSiteList(id) {
  const l = listById(id);
  if (!l) return viewMissing("That site list");
  const draft = l.sites.map(x => ({ ...x }));
  const groups = usedBy(l.id);
  const kiosks = db.devices.filter(d => groups.some(g => g.id === d.group)).length;
  $("#view").innerHTML = `
    <a class="back" href="#sitelists">← All site lists</a>
    <div class="head"><div><h1>${esc(l.name)}</h1>
      <p class="sub">${groups.length ? `Used by ${groups.map(g => `<a href="#group-${g.id}">${esc(g.name)}</a>`).join(", ")} (${kiosks} kiosk${kiosks === 1 ? "" : "s"}).` : "Not used by any group yet. Switch it on from a group's page."}</p></div></div>
    <div class="grid2">
      <form class="panel card" id="lForm" novalidate>
        <div class="field"><label for="lName">List name</label><input type="text" id="lName" value="${esc(l.name)}" maxlength="50"></div>
        <div class="field"><label for="lDesc">Description</label><input type="text" id="lDesc" value="${esc(l.description)}" maxlength="140" placeholder="What these sites are for"></div>
        <div class="section-title"><b>Sites</b><span class="dim" id="lDirty"></span></div>
        <div id="lTable"></div>
        <div class="row" style="margin-top:14px"><button class="primary" type="submit">Save changes</button>
          <button type="button" class="danger" id="lDelete">Delete list</button></div>
        <div id="lConfirm" hidden style="margin-top:12px" class="banner">Delete ${esc(l.name)}? ${groups.length ? `It is switched off in ${groups.length} group${groups.length === 1 ? "" : "s"}, and their kiosks lose these sites unless another list has them.` : ""}
          <div class="row" style="margin-top:8px"><button type="button" class="danger" id="lDeleteYes">Delete</button><button type="button" id="lDeleteNo">Keep</button></div></div>
      </form>
      <div class="panel card"><h2>Importing a spreadsheet</h2>
        <p class="dim" style="margin-top:0">Use a CSV or Excel file with one site per row. A column headed <span class="mono">site</span>, <span class="mono">url</span> or <span class="mono">domain</span> is used for the addresses, and one headed <span class="mono">note</span> or <span class="mono">description</span> for notes. Without headings, the column that looks most like web addresses is used.</p>
        <p class="dim">Addresses are cleaned up on import: <span class="mono">https://www.Example.com/</span> becomes <span class="mono">example.com</span>. Duplicates are skipped, and anything that isn't a site address is listed so you can check it.</p>
        <p class="dim" style="margin-bottom:0">You see a preview first, then choose to add the new sites or replace the whole list.</p>
      </div>
    </div>`;
  siteTable.state["l-" + id] = null;
  siteTable($("#lTable"), draft, () => ($("#lDirty").textContent = "Unsaved changes"), "l-" + id);
  $("#lForm").onsubmit = e => {
    e.preventDefault();
    l.name = $("#lName").value.trim() || l.name;
    l.description = $("#lDesc").value.trim();
    l.sites = draft.map(x => ({ ...x }));
    toast(groups.length ? `Saved. ${kiosks} kiosk${kiosks === 1 ? "" : "s"} update within 15 minutes.` : "Saved");
    viewSiteList(id); renderNav("sitelist");
  };
  $("#lDelete").onclick = () => ($("#lConfirm").hidden = false);
  $("#lDeleteNo").onclick = () => ($("#lConfirm").hidden = true);
  $("#lDeleteYes").onclick = () => {
    db.groups.forEach(g => (g.siteLists = g.siteLists.filter(x => x !== l.id)));
    db.siteLists = db.siteLists.filter(x => x !== l);
    toast(`Deleted ${l.name}`); location.hash = "#sitelists";
  };
}

function viewPassword() {
  const p = db.password, total = db.devices.length;
  $("#view").innerHTML = `
    <div class="head"><div><h1>Admin password</h1>
      <p class="sub">The password for the admin menu (Ctrl+Alt+Shift+A) on every kiosk. Only a scrambled form is stored and sent, so nobody can read it back. Not even here.</p></div></div>
    <div class="grid2">
      <form class="panel card" id="pForm">
        <div class="field"><label for="p1">New password</label><input type="password" id="p1" autocomplete="new-password" minlength="10"><span class="hint">At least 10 characters. A short phrase is easiest to type on a kiosk.</span></div>
        <div class="field"><label for="p2">Type it again</label><input type="password" id="p2" autocomplete="new-password"></div>
        <span class="err" id="pErr"></span>
        <div class="row" style="margin-top:6px"><button class="primary" type="submit">Set password</button></div>
      </form>
      <div class="panel card"><h2>Current password</h2>
        <dl><dt>Last changed</dt><dd>${new Date(p.changed).toLocaleDateString()} by ${esc(p.by)}</dd>
          <dt>Kiosks using it</dt><dd><b>${p.applied}</b> of ${total}</dd></dl>
        <p class="dim" style="margin-bottom:0">Kiosks that are off pick up the new password the next time they check in. Until then they keep the old one.</p>
      </div>
    </div>`;
  $("#pForm").onsubmit = e => {
    e.preventDefault();
    const a = $("#p1").value, b = $("#p2").value;
    $("#pErr").textContent = a.length < 10 ? "Use at least 10 characters." : a !== b ? "The two passwords don't match." : "";
    if ($("#pErr").textContent) return;
    Object.assign(db.password, { changed: Date.now(), by: "you", applied: 0 });
    toast("Password set. Kiosks switch to it within 15 minutes."); viewPassword();
  };
}

function viewMissing(what) {
  $("#view").innerHTML = `<h1>Not found</h1><p class="sub">${what} no longer exists. <a href="#devices">Go to devices</a></p>`;
}

function route() {
  const h = location.hash.slice(1) || "devices";
  renderNav(h);
  if (h === "devices") viewDevices();
  else if (h.startsWith("device-")) viewDevice(h.slice(7));
  else if (h === "groups") viewGroups();
  else if (h.startsWith("group-")) viewGroup(h.slice(6));
  else if (h === "sitelists") viewSiteLists();
  else if (h.startsWith("sitelist-")) viewSiteList(h.slice(9));
  else if (h === "password") viewPassword();
  else viewDevices();
  window.scrollTo(0, 0);
}
// Appearance: Light, Dark, or Auto (follows the computer's setting). Remembered on this browser.
function setTheme(mode, save) {
  if (mode === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", mode);
  document.querySelectorAll("[data-theme-set]").forEach(b => b.setAttribute("aria-pressed", b.dataset.themeSet === mode));
  if (save) try { localStorage.setItem("kiosk-manager-theme", mode); } catch (e) {}
}
document.querySelectorAll("[data-theme-set]").forEach(b => b.onclick = () => setTheme(b.dataset.themeSet, true));
let savedTheme = "system";
try { savedTheme = localStorage.getItem("kiosk-manager-theme") || "system"; } catch (e) {}
setTheme(savedTheme, false);

addEventListener("hashchange", route);
route();
</script>
