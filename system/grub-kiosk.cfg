# /etc/default/grub.d/kiosk.cfg
# Block USB storage drivers from the very start of boot (the initramfs loads
# them before /etc/modprobe.d rules apply). Becomes a config toggle in Phase 3.
# "quiet splash" shows the boot splash instead of kernel messages.
GRUB_CMDLINE_LINUX="modprobe.blacklist=usb_storage,uas"
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 vt.global_cursor_default=0"
