# Settings for the "default" group of kiosks.
# Edit this file on GitHub; kiosks in this group pick up changes automatically.
# NEVER put passwords or other sensitive information in this repository: it is public.
#
# A line starting with # is a note and is ignored. Text goes in "double quotes".

# Pages opened at the start of every session (one tab each).
home_pages = [
    "https://www.regalstaffing.com/portal",
    "https://infinitelooper.tube/?videoId=6ah4yixGWc4&start=0&end=351.3&rate=1&timestamp=1758116636318",
    "https://infinitelooper.tube/?videoId=uCD2Qir8d_w&start=0&end=2136&rate=1&timestamp=1738784682817",
]

# Page opened by the "new tab" button. Leave out to use the first home page.
new_tab_page = "https://www.regalstaffing.com/portal"

[session]
# Wipe the session after this many minutes with no keyboard, mouse or touch input. 0 = never.
idle_minutes = 6

[browser]
# Allow printing (needs a printer set up on the kiosk).
printing = false

[allow]
# Sites applicants may open. Everything else is blocked.
# "example.com" allows the whole site and its subdomains;
# "example.com/some/page" allows only that page and the pages under it.
